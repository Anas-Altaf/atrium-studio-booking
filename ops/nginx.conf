events { worker_connections 4096; }

http {
  # Round robin across the three replicas. Deliberately no sticky sessions:
  # the point of the proof is that two requests for the same slot may land on
  # different processes and must still not both succeed.
  upstream atrium_api {
    server api-1:3000;
    server api-2:3000;
    server api-3:3000;
  }

  server {
    listen 80;

    # The concurrency proof opens 200 connections at once.
    keepalive_requests 10000;

    location / {
      proxy_pass http://atrium_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Correlation-Id $request_id;
      proxy_read_timeout 30s;
    }
  }
}
