# Three API replicas behind a load balancer, because a correctness strategy
# that only works inside a single process is not a correctness strategy, and a
# single instance will never reveal that.
#
# Every invariant must hold with requests distributed across all three.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atrium
      POSTGRES_PASSWORD: atrium
      POSTGRES_DB: atrium
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atrium -d atrium"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - atrium-data:/var/lib/postgresql/data

  # The mock provider, its own service. Chaos on, because the brief says to run
  # it that way, and because a payment path only tested against a well-behaved
  # provider has not been tested.
  #
  # It calls back through the load balancer rather than a single replica, so
  # deliveries spread across all three and the webhook path is proven on each.
  paygate:
    build: .
    command: ["node", "dist/paygate/server.js"]
    environment:
      PAYGATE_SECRET: paygate-dev-secret
      PAYGATE_CHAOS: "on"
      PAYGATE_CALLBACK_URL: http://lb:80/webhooks/paygate
      PAYGATE_PORT: "4000"
      PAYGATE_SEED: "1337"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  api-1: &api
    build: .
    environment: &api-env
      DATABASE_URL: postgres://atrium:atrium@db:5432/atrium
      JWT_SECRET: dev-secret-do-not-use-in-production
      INSTANCE_ID: api-1
      PORT: "3000"
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Replicas 2 and 3 do not run migrations: the migrator takes an advisory lock
  # so concurrent starts are safe, but skipping the work avoids three processes
  # racing to do the same thing on every boot.
  api-2:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-2
      RUN_MIGRATIONS: "false"
    depends_on:
      api-1: { condition: service_healthy }

  api-3:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-3
      RUN_MIGRATIONS: "false"
    depends_on:
      api-1: { condition: service_healthy }

  lb:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      - ./ops/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api-1, api-2, api-3]

  # Behind a profile, so `docker compose up` does not start a load test.
  #
  #   docker compose --profile bench run --rm k6
  #
  # In the compose network rather than on the host: the reviewer needs Docker
  # for this repo anyway, so the benchmark installs nothing, and it reaches the
  # load balancer by service name without host-networking differences between
  # Docker Desktop and Linux.
  k6:
    image: grafana/k6:latest
    profiles: ["bench"]
    environment:
      BASE_URL: http://lb:80
    volumes:
      - ./bench/k6:/scripts
    working_dir: /scripts
    entrypoint: ["k6", "run", "/scripts/load-test.js"]
    depends_on: [lb]

volumes:
  atrium-data:
